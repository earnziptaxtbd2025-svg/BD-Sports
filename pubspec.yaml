name: bd_sports
description: Bangladesh grassroots football and cricket tournament platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
