name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here, so the repo only holds our own code.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rakib --project-name bd_sports /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Configure Android manifest (internet permission, app name)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="BD Sports"|' "$MANIFEST"

      - name: Configure Gradle properties for release build
        run: |
          if [ -f android/gradle.properties ]; then
            echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      # Non-blocking for now so the first APK always builds. Make these strict later.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=0.1.0
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: bd-sports-apk
          path: build/app/outputs/flutter-apk/app-release.apk
